name: Publish SIH browser app

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'index.html'
      - 'static/**'
      - 'fonts/**'
      - 'my_logo.png'
      - 'drone_bg.mp4'
      - '.github/workflows/browser-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/configure-pages@v5
      - name: Install pinned browser dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Browser geometry, imagery, persistence and inference checks
        working-directory: web
        run: pnpm test
      - name: Build the actual browser app
        working-directory: web
        run: pnpm build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy browser workspace
        id: deployment
        uses: actions/deploy-pages@v4
